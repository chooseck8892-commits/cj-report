            :root{
                --bg-card:#fffdf9; --gold:#b08d57; --gold-soft:#e9dcc3;
                --ink:#26241f; --ink-2:#5c5850; --line:#e6e0d4;
                --accent:#1f4e79; --crit:#c03434;
            }
            *{box-sizing:border-box;margin:0;padding:0}
            .staticrypt-html{height:100%}
            .staticrypt-body{
                height:100%;margin:0;
                font-family:"PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
                background:linear-gradient(160deg,#f7f4ee 0%,#efe7d8 100%);
                color:var(--ink);
            }
            .staticrypt-content{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
            .staticrypt-form{
                background:var(--bg-card);border:1px solid var(--gold-soft);border-radius:16px;
                padding:38px 34px;max-width:380px;width:100%;text-align:center;
                box-shadow:0 10px 40px rgba(176,141,87,.18);
            }
            .cj-brand{font-size:.85rem;color:var(--gold);letter-spacing:.35em;margin-bottom:8px}
            .staticrypt-title{font-size:1.25rem;color:var(--accent);letter-spacing:.05em;font-weight:700;margin-bottom:5px}
            .staticrypt-instructions p:last-child{font-size:.92rem;color:var(--ink-2)}
            .staticrypt-hr{margin:18px 0;border:0;border-top:1px solid var(--line)}
            .staticrypt-password-container{
                position:relative;width:100%;margin:0 0 14px;
                background:#fff;border:1px solid var(--line);border-radius:8px;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"]{
                background:transparent;border:0;outline:0;width:100%;
                font-size:1.05rem;padding:11px 42px 11px 15px;
                text-align:center;letter-spacing:.3em;color:var(--ink);
            }
            .staticrypt-password-container:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,87,.15)}
            .staticrypt-toggle-password-visibility{
                cursor:pointer;height:18px;width:18px;opacity:45%;padding:12px;
                position:absolute;right:2px;top:50%;transform:translateY(-50%);
            }
            label.staticrypt-remember{
                display:flex;align-items:center;justify-content:center;gap:8px;
                margin-bottom:14px;font-size:.9rem;color:var(--ink-2);cursor:pointer;
            }
            .staticrypt-remember input[type="checkbox"]{accent-color:var(--gold);width:16px;height:16px}
            .staticrypt-form .staticrypt-decrypt-button{
                width:100%;border:0;border-radius:8px;padding:11px;cursor:pointer;
                background:linear-gradient(135deg,#c7a468,#a9854e);color:#fff;
                font-size:1rem;letter-spacing:.25em;font-weight:600;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus{filter:brightness(1.06)}
            #cj-error{color:var(--crit);font-size:.9rem;margin-top:12px;min-height:1.3em}
            .cj-foot{margin-top:16px;font-size:.8rem;color:#8d8880}
            .hidden{display:none !important}
            .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center}
            .staticrypt-spinner{
                display:inline-block;width:2rem;height:2rem;border:.25em solid var(--gold-soft);
                border-right-color:var(--gold);border-radius:50%;
                animation:spinner-border .75s linear infinite;
            }
            @keyframes spinner-border{100%{transform:rotate(360deg)}}
        </style>
